name: Testar builds Android

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Instalar Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Instalar dependências web
        run: npm install --no-audit --no-fund
      - name: Preparar assets Android
        run: npm run prepare:android
      - name: Validar fonte
        run: npm run validate
      - name: Compilar Stable e Beta debug
        env:
          BUILD_TIME: ${{ github.event.head_commit.timestamp || 'ci' }}
        run: gradle -p android :app:assembleStableDebug :app:assembleBetaDebug --max-workers=1 --stacktrace
      - name: Publicar APKs de teste
        uses: actions/upload-artifact@v4
        with:
          name: treinoapp-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/stable/debug/*.apk
            android/app/build/outputs/apk/beta/debug/*.apk
          if-no-files-found: error
