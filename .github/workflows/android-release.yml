name: Gerar APK e AAB assinados

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Instalar Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Conferir secrets de assinatura
        env:
          KS: ${{ secrets.TREINOAPP_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.TREINOAPP_KEYSTORE_PASSWORD }}
          KSA: ${{ secrets.TREINOAPP_KEY_ALIAS }}
          KSK: ${{ secrets.TREINOAPP_KEY_PASSWORD }}
        run: |
          test -n "$KS" || (echo "Secret TREINOAPP_KEYSTORE_BASE64 ausente" && exit 1)
          test -n "$KSP" || (echo "Secret TREINOAPP_KEYSTORE_PASSWORD ausente" && exit 1)
          test -n "$KSA" || (echo "Secret TREINOAPP_KEY_ALIAS ausente" && exit 1)
          test -n "$KSK" || (echo "Secret TREINOAPP_KEY_PASSWORD ausente" && exit 1)
      - name: Conferir tag e versão
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(cat VERSION | tr -d '\r\n')
          TAG=${GITHUB_REF_NAME#v}
          test "$VERSION" = "$TAG" || (echo "Tag v$TAG não coincide com VERSION $VERSION" && exit 1)
      - name: Restaurar chave de assinatura
        env:
          TREINOAPP_KEYSTORE_BASE64: ${{ secrets.TREINOAPP_KEYSTORE_BASE64 }}
        run: |
          echo "$TREINOAPP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/treinoapp-release.jks"
          chmod 600 "$RUNNER_TEMP/treinoapp-release.jks"
      - name: Instalar dependências web
        run: npm install --no-audit --no-fund
      - name: Preparar assets Android
        run: npm run prepare:android
      - name: Validar projeto
        run: npm run validate
      - name: Definir dados do build
        run: |
          echo "BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "VERSION=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_ENV"
      - name: Compilar releases assinadas
        env:
          TREINOAPP_KEYSTORE_PATH: ${{ runner.temp }}/treinoapp-release.jks
          TREINOAPP_KEYSTORE_PASSWORD: ${{ secrets.TREINOAPP_KEYSTORE_PASSWORD }}
          TREINOAPP_KEY_ALIAS: ${{ secrets.TREINOAPP_KEY_ALIAS }}
          TREINOAPP_KEY_PASSWORD: ${{ secrets.TREINOAPP_KEY_PASSWORD }}
        run: gradle -p android :app:assembleStableRelease :app:bundleStableRelease :app:assembleBetaRelease :app:bundleBetaRelease --stacktrace
      - name: Organizar artefatos
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/stable/release/app-stable-release.apk "dist/TreinoApp-v${VERSION}-stable.apk"
          cp android/app/build/outputs/bundle/stableRelease/app-stable-release.aab "dist/TreinoApp-v${VERSION}-stable.aab"
          cp android/app/build/outputs/apk/beta/release/app-beta-release.apk "dist/TreinoApp-v${VERSION}-beta.apk"
          cp android/app/build/outputs/bundle/betaRelease/app-beta-release.aab "dist/TreinoApp-v${VERSION}-beta.aab"
          sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Guardar artefatos da execução
        uses: actions/upload-artifact@v4
        with:
          name: TreinoApp-v${{ env.VERSION }}-signed
          path: dist/*
          if-no-files-found: error
      - name: Criar GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: TreinoApp v${{ env.VERSION }}
          generate_release_notes: true
          files: dist/*
